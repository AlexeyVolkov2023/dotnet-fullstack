services:
  postgres:
    container_name: postgres
    image: postgres
    restart: always
    environment:
      POSTGRES_DB: directory_service_db
      POSTGRES_USER: directory_user
      POSTGRES_PASSWORD: secure_password_123
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
  
volumes:
  postgres-data: 